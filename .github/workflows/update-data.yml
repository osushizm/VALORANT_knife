name: Update video data

on:
  schedule:
    # 03:00 JST daily
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest video list + view counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-videos.js

      - name: Rebuild site data
        run: node scripts/build.js

      - name: Commit and push if changed
        run: |
          rm -f scripts/result.json
          if git diff --quiet -- assets/data.json scripts/videos.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data.json scripts/videos.json
          git commit -m "Update video data (view counts / new uploads)"
          git push
